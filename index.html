<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NOVA</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial, sans-serif;
background:#070b14;
color:white;
height:100vh;
overflow:hidden;
}

/* APPLICATION */

.app{
display:flex;
height:100vh;
}

/* SIDEBAR */

.sidebar{
width:240px;
background:#0d1422;
border-right:1px solid #1c2a40;
padding:20px;
display:flex;
flex-direction:column;
}

.logo{
width:65px;
height:65px;

margin:0 auto 10px;

border-radius:20px;

display:flex;
align-items:center;
justify-content:center;

font-size:36px;
font-weight:bold;

background:linear-gradient(
135deg,
#4f8cff,
#795cff
);

box-shadow:
0 0 35px #4f8cff66;
}

.name{
text-align:center;
font-size:26px;
font-weight:bold;
}

.online{
text-align:center;
font-size:11px;
color:#39e59a;
margin:8px 0 30px;
}

.menu{
background:#162238;
border:0;
color:white;

width:100%;

padding:13px;

margin-bottom:8px;

border-radius:12px;

text-align:left;

cursor:pointer;

font-size:14px;
}

.menu:hover{
background:#213452;
}

.bottom{
margin-top:auto;

font-size:11px;

color:#667895;

text-align:center;
}

/* CHAT */

.main{
flex:1;

display:flex;
flex-direction:column;

min-width:0;
}

/* HEADER */

.header{
height:70px;

border-bottom:
1px solid #1c2a40;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;
}

.headerTitle{
font-size:20px;
font-weight:bold;
}

.status{
color:#39e59a;
font-size:11px;
}

/* CHAT */

.chat{
flex:1;

overflow-y:auto;

padding:30px;
}

/* MESSAGES */

.message{
max-width:700px;

padding:15px 18px;

border-radius:15px;

margin-bottom:15px;

line-height:1.5;

white-space:pre-wrap;
}

.nova{
background:#101b2d;

border:
1px solid #1e304c;
}

.user{
background:#18345e;

margin-left:auto;
}

.author{
font-size:10px;

color:#70a1ff;

font-weight:bold;

margin-bottom:6px;
}

/* INPUT */

.inputArea{
padding:15px 25px 25px;

border-top:
1px solid #1c2a40;

display:flex;

gap:10px;
}

.input{
flex:1;

background:#101a2b;

border:
1px solid #293c5c;

border-radius:13px;

padding:15px;

color:white;

font-size:15px;

outline:none;
}

.input:focus{
border-color:#4f8cff;
}

.send{
background:#4f8cff;

border:0;

border-radius:13px;

padding:0 22px;

color:white;

font-weight:bold;

cursor:pointer;
}

.send:hover{
background:#669cff;
}

/* MODAL */

.modal{
display:none;

position:fixed;

inset:0;

background:#000b;

align-items:center;

justify-content:center;

padding:20px;
}

.modalBox{
background:#101827;

border:
1px solid #263653;

border-radius:20px;

padding:25px;

width:min(600px,100%);

max-height:80vh;

overflow:auto;
}

.close{
float:right;

border:0;

background:#263653;

color:white;

padding:8px 12px;

border-radius:8px;

cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

.sidebar{
display:none;
}

.chat{
padding:15px;
}

.header{
padding:0 15px;
}

.inputArea{
padding:10px;
}

}

</style>

</head>


<body>


<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">

<div class="logo">
N
</div>

<div class="name">
NOVA
</div>

<div class="online">
● EN LIGNE
</div>


<button
class="menu"
onclick="focusInput()">

💬 Nouvelle conversation

</button>


<button
class="menu"
onclick="showMemory()">

🧠 Mémoire

</button>


<button
class="menu"
onclick="speakLast()">

🔊 Faire parler NOVA

</button>


<button
class="menu"
onclick="showStats()">

📊 Statistiques

</button>


<button
class="menu"
onclick="showHelp()">

❔ Aide

</button>


<div class="bottom">

NOVA Web Edition

<br>

Prototype local

</div>

</aside>


<!-- PRINCIPAL -->

<main class="main">


<header class="header">

<div class="headerTitle">

NOVA

</div>

<div class="status">

● SYSTÈME ACTIF

</div>

</header>


<!-- CHAT -->

<section
id="chat"
class="chat">

</section>


<!-- INPUT -->

<div class="inputArea">

<input
id="input"
class="input"
placeholder="Écris quelque chose à NOVA..."
autocomplete="off"
>

<button
class="send"
onclick="sendMessage()">

➤

</button>

</div>


</main>

</div>


<!-- MODAL -->

<div
id="modal"
class="modal">

<div
id="modalBox"
class="modalBox">

</div>

</div>


<script>


/* =========================
MEMOIRE
========================= */

let memory =
JSON.parse(
localStorage.getItem(
"NOVA_MEMORY"
) || "{}"
);


let history =
JSON.parse(
localStorage.getItem(
"NOVA_HISTORY"
) || "[]"
);


let lastAnswer = "";


/* =========================
OUTILS
========================= */

function save(){

localStorage.setItem(
"NOVA_MEMORY",
JSON.stringify(memory)
);

localStorage.setItem(
"NOVA_HISTORY",
JSON.stringify(history)
);

}


function normalize(text){

return text
.toLowerCase()
.normalize("NFD")
.replace(
/[\u0300-\u036f]/g,
""
)
.trim();

}


function focusInput(){

document
.getElementById("input")
.focus();

}


/* =========================
MESSAGE
========================= */

function addMessage(
author,
text
){

const chat =
document.getElementById(
"chat"
);


const div =
document.createElement(
"div"
);


div.className =
"message " +
(
author === "NOVA"
? "nova"
: "user"
);


div.innerHTML =

"<div class='author'>" +

author +

"</div>" +

text
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/\n/g,
"<br>"
);


chat.appendChild(
div
);


chat.scrollTop =
chat.scrollHeight;

}


/* =========================
CERVEAU
========================= */

function novaAnswer(question){

const q =
normalize(question);


/* SALUT */

if(
q === "salut" ||
q === "bonjour" ||
q === "coucou" ||
q === "hello"
){

return `
Salut Tijl ! 👋

Je suis NOVA.

Je suis prête à discuter avec toi.
`;

}


/* NOM */

if(
q.includes("ton nom") ||
q.includes("comment tu t'appelles")
){

return `
Je m'appelle NOVA. 🧠
`;

}


/* =========================
MEMORISATION
========================= */

let remember =
q.match(
/^(retiens que|souviens toi que|memorise que)\s+(.+?)\s*=\s*(.+)$/
);


if(remember){

let key =
remember[2].trim();

let value =
remember[3].trim();


memory[key] =
value;


save();


return `
Compris ! 🧠

Je retiens :

${key} = ${value}
`;

}


/* =========================
MEMOIRE
========================= */

if(
q.includes("qu'est ce que tu sais") ||
q.includes("que sais tu de moi") ||
q === "memoire"
){

let keys =
Object.keys(memory);


if(keys.length === 0){

return `
Ma mémoire est actuellement vide.
`;

}


return `
🧠 Voici ce que je retiens :

` +

keys
.map(
key =>
"• " +
key +
" = " +
memory[key]
)
.join("\n");

}


/* =========================
OUBLI
========================= */

if(
q.startsWith("oublie ")
){

let key =
q.substring(7)
.trim();


if(
memory[key] !== undefined
){

delete memory[key];

save();


return `
C'est oublié. 🧠
`;

}


return `
Je n'ai pas trouvé ce souvenir.
`;

}


/* =========================
HEURE
========================= */

if(
q.includes("quelle heure")
){

return `
Il est actuellement :

${new Date().toLocaleTimeString(
"fr-FR"
)}
`;

}


/* =========================
DATE
========================= */

if(
q.includes("quelle date")
){

return `
Nous sommes le :

${new Date().toLocaleDateString(
"fr-FR"
)}
`;

}


/* =========================
CALCUL
========================= */

let expression =
q
.replace(
"calcule ",
""
)
.replace(
"combien font ",
""
);


if(
/^[0-9+\-*/(). ]+$/.test(
expression
)
&&
/[0-9]/.test(expression)
){

try{

let result =
Function(
'"use strict";return (' +
expression +
')'
)();


return `
🧮 Résultat :

${result}
`;

}

catch(e){}

}


/* =========================
CONNAISSANCES
========================= */

if(
q.includes("union europeenne")
){

return `
L'Union européenne est une organisation politique et économique qui regroupe plusieurs États européens.

Elle possède notamment un marché intérieur commun et des institutions communes.
`;

}


if(
q.includes("gravite")
){

return `
La gravité est une interaction physique qui attire les corps ayant une masse les uns vers les autres.
`;

}


if(
q.includes("python")
){

return `
Python est un langage de programmation très utilisé, notamment pour le développement logiciel, l'automatisation et l'intelligence artificielle.
`;

}


/* =========================
REPONSE PAR DEFAUT
========================= */

return `
Je ne connais pas encore cette réponse.

Tu peux m'apprendre quelque chose avec :

« Retiens que couleur préférée = bleu »

🧠
`;

}


/* =========================
ENVOYER
========================= */

function sendMessage(){

const input =
document.getElementById(
"input"
);


const question =
input.value.trim();


if(!question)
return;


input.value = "";


addMessage(
"TOI",
question
);


const answer =
novaAnswer(
question
);


addMessage(
"NOVA",
answer
);


lastAnswer =
answer;


history.push({

question:
question,

answer:
answer,

date:
new Date().toISOString()

});


save();

}


/* =========================
ENTREE
========================= */

document
.getElementById("input")
.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter"
){

sendMessage();

}

}
);


/* =========================
MEMOIRE
========================= */

function showMemory(){

let keys =
Object.keys(memory);


let html =
`
<button class="close"
onclick="closeModal()">
X
</button>

<h2>🧠 Mémoire de NOVA</h2>
`;


if(keys.length === 0){

html +=
"<p>Ma mémoire est vide.</p>";

}

else{

keys.forEach(
function(key){

html +=

"<p>• <b>" +
key +
"</b> = " +
memory[key] +
"</p>";

}

);

}


openModal(
html
);

}


/* =========================
STATS
========================= */

function showStats(){

openModal(`

<button class="close"
onclick="closeModal()">
X
</button>

<h2>📊 Statistiques</h2>

<p>
Souvenirs :
${Object.keys(memory).length}
</p>

<p>
Messages :
${history.length}
</p>

<p>
Stockage :
Navigateur local
</p>

`);

}


/* =========================
AIDE
========================= */

function showHelp(){

openModal(`

<button class="close"
onclick="closeModal()">
X
</button>

<h2>❔ Comment utiliser NOVA ?</h2>

<p>
Tu peux discuter normalement.
</p>

<p>
🧠 Pour apprendre :
</p>

<p>
<b>
Retiens que couleur préférée = bleu
</b>
</p>

<p>
🧠 Pour consulter sa mémoire :
</p>

<p>
<b>
Qu'est-ce que tu sais de moi ?
</b>
</p>

<p>
🧠 Pour oublier :
</p>

<p>
<b>
Oublie couleur préférée
</b>
</p>

<p>
🧮 Pour calculer :
</p>

<p>
<b>
Calcule 25*4
</b>
</p>

`);

}


/* =========================
VOIX
========================= */

function speakLast(){

if(!lastAnswer)
return;


speechSynthesis.cancel();


let voice =
new SpeechSynthesisUtterance(
lastAnswer
);


voice.lang =
"fr-FR";


voice.rate =
1;


speechSynthesis.speak(
voice
);

}


/* =========================
MODAL
========================= */

function openModal(
content
){

document
.getElementById(
"modalBox"
)
.innerHTML =
content;


document
.getElementById(
"modal"
)
.style.display =
"flex";

}


function closeModal(){

document
.getElementById(
"modal"
)
.style.display =
"none";

}


/* =========================
MESSAGE DE DEPART
========================= */

addMessage(
"NOVA",

`Salut Tijl ! 👋

Je suis NOVA.

🧠 Ma mémoire est activée.
💬 Tu peux me parler.
🔊 Je peux parler à voix haute.
🧮 Je peux effectuer des calculs.

Essaie :

« Retiens que couleur préférée = bleu »

Puis :

« Qu'est-ce que tu sais de moi ? »
`

);

</script>

</body>

</html>
