<script>

/* ==========================================
   VARIABLES
========================================== */

let historyData =
    JSON.parse(
        localStorage.getItem("novaHistory") || "[]"
    );

let memory =
    JSON.parse(
        localStorage.getItem("novaMemory") || "{}"
    );

let lastNovaMessage = "";



/* ==========================================
   SAUVEGARDE
========================================== */

function saveData() {

    localStorage.setItem(
        "novaHistory",
        JSON.stringify(historyData)
    );

    localStorage.setItem(
        "novaMemory",
        JSON.stringify(memory)
    );

}



/* ==========================================
   CHAT
========================================== */

function addMessage(sender, text) {

    const chat =
        document.getElementById("chat");

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const message =
        document.createElement("div");

    message.className =
        "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (sender === "NOVA"
            ? "nova"
            : "user");

    avatar.textContent =
        sender === "NOVA"
            ? "N"
            : "👤";


    const content =
        document.createElement("div");

    content.className =
        "messageContent";


    const name =
        document.createElement("div");

    name.className =
        "messageName";

    name.textContent =
        sender;


    const textElement =
        document.createElement("div");

    textElement.textContent =
        text;


    content.appendChild(name);

    content.appendChild(textElement);

    message.appendChild(avatar);

    message.appendChild(content);

    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;

}



/* ==========================================
   ENVOYER
========================================== */

function sendMessage() {

    const input =
        document.getElementById("userInput");

    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    addMessage(
        "TOI",
        message
    );


    historyData.push({
        role: "user",
        text: message,
        date: new Date().toISOString()
    });


    input.value = "";


    setTimeout(() => {

        const answer =
            novaAnswer(message);


        addMessage(
            "NOVA",
            answer
        );


        lastNovaMessage =
            answer;


        historyData.push({
            role: "nova",
            text: answer,
            date: new Date().toISOString()
        });


        saveData();

    }, 250);

}



/* ==========================================
   ENTRÉE
========================================== */

document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );



/* ==========================================
   MESSAGE RAPIDE
========================================== */

function quickMessage(text) {

    document
        .getElementById("userInput")
        .value = text;

    sendMessage();

}



/* ==========================================
   CERVEAU NOVA
========================================== */

function novaAnswer(message) {

    const original =
        message.trim();

    const text =
        original.toLowerCase();


    /* SALUT */

    if (
        text === "bonjour" ||
        text === "salut" ||
        text === "hello" ||
        text.includes("coucou")
    ) {

        return "Bonjour 👋 Je suis NOVA. Que puis-je faire pour toi ?";

    }


    /* AIDE */

    if (
        text.includes("que peux-tu faire") ||
        text.includes("aide") ||
        text === "help"
    ) {

        return (
            "Je peux actuellement :\n\n" +
            "🧠 mémoriser des informations\n" +
            "🗑️ oublier une information\n" +
            "🕐 donner l'heure et la date\n" +
            "🧮 faire des calculs simples\n" +
            "📊 afficher mes statistiques\n" +
            "🔊 lire mes réponses à voix haute\n" +
            "💬 discuter avec toi\n\n" +
            "Exemple : « Retiens que ma couleur préférée = bleu »."
        );

    }


    /* HEURE */

    if (
        text.includes("quelle heure") ||
        text.includes("l'heure")
    ) {

        return (
            "Il est actuellement " +
            new Date().toLocaleTimeString(
                "fr-FR",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ) +
            " ⏰"
        );

    }


    /* DATE */

    if (
        text.includes("quelle date") ||
        text.includes("quel jour") ||
        text.includes("date d'aujourd")
    ) {

        return (
            "Nous sommes le " +
            new Date().toLocaleDateString(
                "fr-FR",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            ) +
            " 📅"
        );

    }


    /* MÉMOIRE : RETENIR */

    if (
        text.startsWith("retiens que") ||
        text.startsWith("souviens-toi que") ||
        text.startsWith("mémorise que")
    ) {

        let content =
            original
                .replace(
                    /^retiens que\s*/i,
                    ""
                )
                .replace(
                    /^souviens-toi que\s*/i,
                    ""
                )
                .replace(
                    /^mémorise que\s*/i,
                    ""
                );


        const parts =
            content.split("=");


        if (parts.length >= 2) {

            const key =
                parts[0].trim();

            const value =
                parts.slice(1)
                    .join("=")
                    .trim();


            memory[key] = value;

            saveData();


            return (
                "C'est retenu 🧠\n\n" +
                key +
                " = " +
                value
            );

        }


        return (
            "Je peux le mémoriser, mais utilise par exemple :\n\n" +
            "« Retiens que ma couleur préférée = bleu »"
        );

    }



    /* MÉMOIRE : QU'EST-CE QUE TU SAIS */

    if (
        text.includes("qu'est-ce que tu sais de moi") ||
        text.includes("que sais-tu de moi") ||
        text.includes("ma mémoire")
    ) {

        const keys =
            Object.keys(memory);


        if (keys.length === 0) {

            return (
                "Ma mémoire est encore vide 🧠\n\n" +
                "Tu peux me dire :\n" +
                "« Retiens que ma couleur préférée = bleu »"
            );

        }


        let result =
            "Voici ce que je retiens :\n\n";


        keys.forEach(key => {

            result +=
                "• " +
                key +
                " = " +
                memory[key] +
                "\n";

        });


        return result;

    }



    /* OUBLI */

    if (
        text.startsWith("oublie ")
    ) {

        const key =
            original
                .substring(7)
                .trim();


        if (
            memory[key] !== undefined
        ) {

            delete memory[key];

            saveData();


            return (
                "C'est oublié 🗑️"
            );

        }


        return (
            "Je n'ai pas trouvé « " +
            key +
            " » dans ma mémoire."
        );

    }



    /* CALCUL */

    if (
        text.startsWith("calcule ") ||
        text.startsWith("calcul ")
    ) {

        let expression =
            original
                .replace(
                    /^calcule\s*/i,
                    ""
                )
                .replace(
                    /^calcul\s*/i,
                    ""
                )
                .replace(
                    /,/g,
                    "."
                );


        /*
          Autorise uniquement
          chiffres et opérateurs
        */

        if (
            /^[0-9+\-*/().%\s]+$/
                .test(expression)
        ) {

            try {

                const result =
                    Function(
                        '"use strict"; return (' +
                        expression +
                        ')'
                    )();


                return (
                    "Le résultat est : " +
                    result +
                    " 🧮"
                );

            } catch {

                return "Je n'arrive pas à calculer cette expression.";

            }

        }

        return "Je peux calculer des expressions numériques simples.";

    }



    /* STATISTIQUES */

    if (
        text.includes("statistiques")
    ) {

        return (
            "📊 Statistiques NOVA\n\n" +
            "Messages enregistrés : " +
            historyData.length +
            "\n" +
            "Souvenirs : " +
            Object.keys(memory).length
        );

    }



    /* CONNAISSANCES */

    if (
        text.includes("gravité")
    ) {

        return (
            "La gravité est une interaction qui attire les objets possédant une masse les uns vers les autres. 🌍"
        );

    }


    if (
        text.includes("python")
    ) {

        return (
            "Python est un langage de programmation très utilisé pour le développement, les sciences, l'automatisation et l'intelligence artificielle. 🐍"
        );

    }


    if (
        text.includes("union européenne") ||
        text === "ue"
    ) {

        return (
            "L'Union européenne est une organisation politique et économique regroupant plusieurs pays européens."
        );

    }



    /* RÉPONSE PAR DÉFAUT */

    return (

/* ==========================================
   PARLER
========================================== */

function speakLast() {

    if (!lastNovaMessage) {

        alert(
            "NOVA n'a pas encore de réponse à lire."
        );

        return;

    }


    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "La synthèse vocale n'est pas disponible sur ce navigateur."
        );

        return;

    }


    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            lastNovaMessage
        );


    speech.lang =
        "fr-FR";

    speech.rate =
        1;

    speech.pitch =
        1;


    speechSynthesis.speak(
        speech
    );

}

function openMemory() {

    const keys =
        Object.keys(memory);


    let html =
        "<p>Les informations enregistrées par NOVA sont stockées dans le navigateur.</p>";


    if (keys.length === 0) {

        html +=

    } else {

        keys.forEach(key => {

            html += `
                <div class="memoryItem">

                    <span>
                        <strong>${escapeHTML(key)}</strong>
                        =
                        ${escapeHTML(memory[key])}
                    </span>

                    <button
                        class="modalButton"
                        onclick="forgetMemory('${escapeJS(key)}')">

                        🗑️

                    </button>

                </div>
            `;

    }


    html += `
        <button
            class="modalButton danger"
            onclick="clearMemory()">

        </button>
    `;


    openModal(
        "🧠 Mémoire de NOVA",
        html
    );

}

/* ==========================================
   SÉCURITÉ HTML
========================================== */

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJS(value) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}



/* ==========================================
   CHARGER L'HISTORIQUE
========================================== */

function loadHistory() {

    if (
        historyData.length === 0
    ) {

        return;

    }


    document
        .getElementById("chat")
        .innerHTML = "";


    historyData
        .slice(-30)
        .forEach(item => {

            addMessage(
                item.role === "nova"
                    ? "NOVA"
                    : "TOI",
                item.text
            );

            if (
                item.role === "nova"
            ) {

                lastNovaMessage =
                    item.text;

            }

        });

}
